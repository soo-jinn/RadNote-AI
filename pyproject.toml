[project]
name = "radnote-ai-classifier"
version = "0.1.0"
description = "Sprint 1 text urgency classification baseline for RadNote-AI"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
onnx = [
  "onnx>=1.15",
  "skl2onnx>=1.17",
]

[tool.uv]
package = false
