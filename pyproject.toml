[project]
name = "radnote-ai"
version = "1.0.0"
description = "Report-text academic prototype with a CPU ONNX server and lightweight edge client"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "numpy>=1.26,<3", "onnxruntime>=1.20,<2", "Pillow>=10,<13",
  "httpx>=0.27,<1", "psutil>=6,<8"
]
[project.optional-dependencies]
ocr = ["easyocr==1.7.2", "torch>=2.5,<3", "torchvision>=0.20,<1"]
training = ["joblib>=1.3", "pandas>=2.1,<4", "scikit-learn>=1.3,<2", "onnx>=1.15", "skl2onnx>=1.17"]
dev = ["pytest>=8,<10"]
docs = ["reportlab>=4,<5"]
[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
